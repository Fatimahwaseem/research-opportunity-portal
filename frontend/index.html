<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Opportunity Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand mb-0 h1">Research Opportunity Portal</span>
    <button class="btn btn-primary" onclick="openForm()">+ New opportunity</button>
  </div>
</nav>

<div class="container">
  <div id="alerts"></div>
  <div id="list" class="row g-3"></div>
</div>

<!-- Details modal -->
<div class="modal fade" id="detailsModal" tabindex="-1">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="detailsTitle"></h5>
      <button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body" id="detailsBody"></div>
  </div></div>
</div>

<!-- Create / edit modal -->
<div class="modal fade" id="formModal" tabindex="-1">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <form id="oppForm" novalidate>
      <div class="modal-header"><h5 class="modal-title" id="formTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body row g-3">
        <input type="hidden" id="oppId">
        <div class="col-12"><label class="form-label">Title</label>
          <input class="form-control" id="title" required></div>
        <div class="col-12"><label class="form-label">Description</label>
          <textarea class="form-control" id="description" rows="3" required></textarea></div>
        <div class="col-md-6"><label class="form-label">Research area</label>
          <input class="form-control" id="research_area" required></div>
        <div class="col-md-6"><label class="form-label">Faculty member</label>
          <input class="form-control" id="faculty_name" required></div>
        <div class="col-md-6"><label class="form-label">Department</label>
          <input class="form-control" id="department" required></div>
        <div class="col-md-6"><label class="form-label">Required skills</label>
          <input class="form-control" id="required_skills" placeholder="e.g. Python, Statistics" required></div>
        <div class="col-md-4"><label class="form-label">Available positions</label>
          <input type="number" min="1" class="form-control" id="positions" required></div>
        <div class="col-md-4"><label class="form-label">Application deadline</label>
          <input type="date" class="form-control" id="deadline" required></div>
        <div class="col-md-4"><label class="form-label">Status</label>
          <select class="form-select" id="status"><option>Open</option><option>Closed</option></select></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
